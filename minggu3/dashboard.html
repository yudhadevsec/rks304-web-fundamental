<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f4f4f5;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('background.webp');
            background-size: cover;
            background-position: center;
            filter: saturate(20%);
            z-index: -1;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans relative py-12">
    <div class="text-center max-w-sm w-full bg-white p-8 rounded-2xl shadow-sm border border-zinc-200 relative">
        <h1 class="text-xl font-medium text-zinc-800 mb-2">Pendaftaran Berhasil</h1>
        <p class="text-zinc-600 text-sm mb-6">Data pendaftaran Anda telah tersimpan. Terima kasih.</p>
        <a href="register.html"
            class="inline-block bg-zinc-800 text-white text-sm px-6 py-2 rounded-lg hover:bg-zinc-900 transition duration-200 font-medium">Kembali</a>
    </div>
</body>

</html>
