<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasbor - Seller Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#ee4d2d' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-60 bg-white border-r border-gray-200 flex flex-col justify-between fixed h-full z-20">
        <div>
            <!-- Logo -->
            <div class="h-14 flex items-center px-5 border-b border-gray-100">
                <span class="text-base font-medium text-primary flex items-center gap-2">
                    <i class="ph ph-storefront text-xl"></i> Seller Center
                </span>
            </div>

            <!-- Navigation -->
            <nav class="p-3 space-y-1 mt-1 text-sm">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-sm bg-orange-50 text-primary font-medium transition-colors">
                    <i class="ph ph-squares-four text-lg"></i> Dasbor
                </a>
                
                <a href="products.html" class="flex items-center gap-3 px-3 py-2 rounded-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors">
                    <i class="ph ph-package text-lg"></i> Produk
                </a>

                <a href="users.html" class="flex items-center gap-3 px-3 py-2 rounded-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors">
                    <i class="ph ph-users text-lg"></i> Pengguna
                </a>

                <a href="settings.html" class="flex items-center gap-3 px-3 py-2 rounded-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors">
                    <i class="ph ph-gear text-lg"></i> Pengaturan
                </a>
            </nav>
        </div>

        <!-- Footer / Logout -->
        <div class="p-4 border-t border-gray-100">
            <a href="index.html" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-500 hover:text-red-600 transition-colors">
                <i class="ph ph-sign-out text-lg"></i> Keluar
            </a>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="flex-1 ml-60 flex flex-col min-h-screen">
        
        <!-- Top Header -->
        <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10 shadow-sm">
            <h2 class="text-sm font-medium text-gray-800">Ringkasan Toko</h2>
            
            <div class="flex items-center gap-4">
                <button class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="ph ph-bell text-lg"></i>
                </button>
                <div class="h-5 border-l border-gray-200"></div>
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-primary overflow-hidden">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Budi" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs font-medium text-gray-600">eBox Official</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="mb-4 flex justify-between items-center">
                <h3 class="text-base font-medium text-gray-800">Performa Bisnis</h3>
            </div>

            <!-- 4 Stats Cards -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-4 rounded-sm border border-gray-200 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-orange-50 flex items-center justify-center text-primary">
                        <i class="ph ph-money text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-0.5">Pendapatan Bersih</p>
                        <h4 class="text-lg font-medium text-gray-800">Rp 12.837.500</h4>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-sm border border-gray-200 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-green-50 flex items-center justify-center text-green-600">
                        <i class="ph ph-shopping-cart text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-0.5">Pesanan Baru</p>
                        <h4 class="text-lg font-medium text-gray-800">187</h4>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-sm border border-gray-200 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center text-blue-600">
                        <i class="ph ph-users text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-0.5">Pengunjung Toko</p>
                        <h4 class="text-lg font-medium text-gray-800">3.421</h4>
                    </div>
                </div>

                <div class="bg-white p-4 rounded-sm border border-gray-200 shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-red-50 flex items-center justify-center text-red-500">
                        <i class="ph ph-package text-xl"></i>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 mb-0.5">Stok Menipis</p>
                        <h4 class="text-lg font-medium text-gray-800">19</h4>
                    </div>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
