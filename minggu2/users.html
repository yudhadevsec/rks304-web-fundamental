<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengguna - Seller Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'] },
                    colors: { primary: '#ee4d2d' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-60 bg-white border-r border-gray-200 flex flex-col justify-between fixed h-full z-20">
        <div>
            <!-- Logo -->
            <div class="h-14 flex items-center px-5 border-b border-gray-100">
                <span class="text-base font-medium text-primary flex items-center gap-2">
                    <i class="ph ph-storefront text-xl"></i> Seller Center
                </span>
            </div>

            <!-- Navigation -->
            <nav class="p-3 space-y-1 mt-1 text-sm">
                <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors">
                    <i class="ph ph-squares-four text-lg"></i> Dasbor
                </a>
                
                <a href="products.html" class="flex items-center gap-3 px-3 py-2 rounded-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors">
                    <i class="ph ph-package text-lg"></i> Produk
                </a>

                <a href="users.html" class="flex items-center gap-3 px-3 py-2 rounded-sm bg-orange-50 text-primary font-medium transition-colors">
                    <i class="ph ph-users text-lg"></i> Pengguna
                </a>

                <a href="settings.html" class="flex items-center gap-3 px-3 py-2 rounded-sm text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors">
                    <i class="ph ph-gear text-lg"></i> Pengaturan
                </a>
            </nav>
        </div>

        <!-- Footer / Logout -->
        <div class="p-4 border-t border-gray-100">
            <a href="index.html" class="flex items-center gap-2 px-3 py-2 text-sm text-gray-500 hover:text-red-600 transition-colors">
                <i class="ph ph-sign-out text-lg"></i> Keluar
            </a>
        </div>
    </aside>

    <!-- Main Wrapper -->
    <div class="flex-1 ml-60 flex flex-col min-h-screen">
        
        <!-- Top Header -->
        <header class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-6 sticky top-0 z-10 shadow-sm">
            <h2 class="text-sm font-medium text-gray-800">Daftar Pengguna</h2>
            
            <div class="flex items-center gap-4">
                <button class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="ph ph-bell text-lg"></i>
                </button>
                <div class="h-5 border-l border-gray-200"></div>
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-full bg-gray-100 flex items-center justify-center text-primary overflow-hidden">
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Budi" alt="Avatar" class="w-full h-full object-cover">
                    </div>
                    <span class="text-xs font-medium text-gray-600">eBox Official</span>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <div class="mb-4 flex justify-between items-center">
                <h3 class="text-base font-medium text-gray-800">Manajemen Pengguna</h3>
                <button class="bg-primary text-white text-xs font-medium py-2 px-3 rounded-sm hover:bg-orange-600 transition-colors shadow-sm">
                    Tambah Pengguna
                </button>
            </div>

            <!-- Table -->
            <div class="bg-white rounded-sm border border-gray-200 shadow-sm overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-gray-50 border-b border-gray-200 text-gray-600">
                            <tr>
                                <th class="py-3 px-4 font-medium w-12 text-center">No</th>
                                <th class="py-3 px-4 font-medium">Nama Lengkap</th>
                                <th class="py-3 px-4 font-medium">Alamat Email</th>
                                <th class="py-3 px-4 font-medium w-32">Peran</th>
                                <th class="py-3 px-4 font-medium w-32 text-center">Aksi</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100 text-gray-700">
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="py-3 px-4 text-center">1</td>
                                <td class="py-3 px-4">Budi Santoso</td>
                                <td class="py-3 px-4">budi@ebox.co.id</td>
                                <td class="py-3 px-4">
                                    <span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px] font-medium">Pemilik Toko</span>
                                </td>
                                <td class="py-3 px-4 text-center">
                                    <div class="flex justify-center gap-3">
                                        <button class="text-blue-500 hover:text-blue-700 transition-colors" title="Ubah">Ubah</button>
                                        <button class="text-gray-400 cursor-not-allowed" title="Tidak dapat dihapus">Hapus</button>
                                    </div>
                                </td>
                            </tr>
                            <tr class="hover:bg-gray-50 transition-colors">
                                <td class="py-3 px-4 text-center">2</td>
                                <td class="py-3 px-4">Siti Aminah</td>
                                <td class="py-3 px-4">siti.admin@ebox.co.id</td>
                                <td class="py-3 px-4">
                                    <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-[10px] font-medium">Admin CS</span>
                                </td>
                                <td class="py-3 px-4 text-center">
                                    <div class="flex justify-center gap-3">
                                        <button class="text-blue-500 hover:text-blue-700 transition-colors" title="Ubah">Ubah</button>
                                        <button class="text-red-500 hover:text-red-700 transition-colors" title="Hapus">Hapus</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
